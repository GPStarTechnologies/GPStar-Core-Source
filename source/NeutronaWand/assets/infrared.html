<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-control" content="public" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Infrared Settings</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .ir-signals-scroll {
        overflow-x: auto;
      }

      .ir-signal-table {
        min-width: 640px;
        table-layout: fixed;
        width: 100%;
      }

      .ir-signal-table th,
      .ir-signal-table td {
        padding: 4px;
        text-align: left;
        vertical-align: middle;
      }

      .ir-signal-table .ir-column-group {
        text-align: center;
      }

      .ir-signal-table th:first-child,
      .ir-signal-table td:first-child {
        width: 40px;
      }

      .ir-signal-table th:nth-child(2),
      .ir-signal-table td:nth-child(2) {
        width: 200px;
      }

      .ir-signal-table input[type="text"] {
        max-width: 100%;
        min-width: 0;
        width: auto;
      }

      .ir-signal-table .ir-byte-select {
        font-size: 0.85rem;
        height: 34px;
        margin: 2px;
        max-width: 64px;
        min-width: 64px;
        padding: 0 1px;
        width: 64px;
      }

      .ir-signal-table .ir-protocol-select {
        font-size: 0.85rem;
        height: 34px;
        margin: 2px;
        width: 100px;
      }

      .ir-signal-table .ir-timing-input {
        box-sizing: border-box;
        min-height: 48px;
        width: 100%;
      }

      .ir-signal-table button {
        font-size: 0.95rem;
        min-width: 0;
        padding: 9px 8px;
        width: auto;
      }
    </style>
  </head>
  <body>
    <h1>Infrared Settings</h1>
    <div class="block left">
      <p>
        Configure up to 10 custom NEC signal definitions. Leave a name blank to clear that slot.
      </p>
    </div>

    <div class="block left">
      <div class="ir-signals-scroll">
        <table class="ir-signal-table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Protocol</th>
              <th scope="colgroup" colspan="4">NEC Address/Command or Timings</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="irSignalRows"></tbody>
        </table>
      </div>
    </div>

    <div class="block left">
      <div class="setting" id="commandSelect" hidden>
        <label for="command"><b>IR Signal:</b></label>
        <select id="command"></select>
      </div>
      <button type="button" id="btnTest" class="orange" onclick="triggerInfrared()">Test IR</button>
    </div>

    <div class="block">
      <hr />
      <div class="button-group">
        <a href="/">&laquo; Back</a>
        <button type="button" class="green" onclick="saveInfrared()" id="saveInfrared">Save</button>
      </div>
    </div>

    <template id="irByteSelectTemplate">
      <select class="ir-byte-select"></select>
    </template>

    <script type="application/javascript" src="/common.js"></script>
    <script type="application/javascript">
      const IR_SIGNAL_LIMIT = 20;
      const IR_SIGNAL_NAME_MAX = 20;
      const IR_RAW_TIMINGS_MAX = 40;
      const IR_PROTOCOL_OPTIONS = [
        { value: 0, label: "NEC" },
        { value: 1, label: "NEC RAW" },
        { value: 2, label: "TIMINGS" },
      ];
      const IR_BYTE_FIELDS = ["Address Byte 1", "Address Byte 2", "Command Byte 1", "Command Byte 2"];

      window.addEventListener("load", onLoad);
      function onLoad() {
        createSignalRows();
        document.getElementById("irTestType").addEventListener("change", updateCommandSelect);
        updateCommandSelect();
        getInfrared();

        initializeHelp("infrared");
      }

      function createSignalRows() {
        var selectTemplate = document.getElementById("irByteSelectTemplate").content.querySelector("select");
        for (var value = 0; value <= 0xFF; value++) {
          var option = document.createElement("option");
          option.value = value.toString();
          option.textContent = value.toString(16).padStart(2, "0").toUpperCase();
          selectTemplate.appendChild(option);
        }

        var rows = document.getElementById("irSignalRows");
        for (var index = 0; index < IR_SIGNAL_LIMIT; index++) {
          rows.appendChild(createSignalRow(index, selectTemplate));
        }
      }

      function createSignalRow(index, selectTemplate) {
        var row = document.createElement("tr");

        var indexCell = document.createElement("td");
        indexCell.textContent = (index + 1).toString();
        row.appendChild(indexCell);

        var nameCell = document.createElement("td");
        var nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.size = IR_SIGNAL_NAME_MAX;
        nameInput.maxLength = IR_SIGNAL_NAME_MAX;
        nameInput.className = "ir-signal-name";
        nameInput.setAttribute("aria-label", "Signal " + (index + 1) + " name");
        nameCell.appendChild(nameInput);
        row.appendChild(nameCell);

        var protocolCell = document.createElement("td");
        var protocolSelect = document.createElement("select");
        protocolSelect.className = "ir-protocol-select";
        protocolSelect.setAttribute("aria-label", "Signal " + (index + 1) + " protocol");
        IR_PROTOCOL_OPTIONS.forEach(function (protocol) {
          var option = document.createElement("option");
          option.value = protocol.value.toString();
          option.textContent = protocol.label;
          protocolSelect.appendChild(option);
        });
        protocolCell.appendChild(protocolSelect);
        row.appendChild(protocolCell);

        for (var field = 0; field < IR_BYTE_FIELDS.length; field++) {
          var byteCell = document.createElement("td");
          byteCell.className = "ir-nec-only";
          var byteSelect = selectTemplate.cloneNode(true);
          byteSelect.value = "0";
          byteSelect.setAttribute("aria-label", "Signal " + (index + 1) + " " + IR_BYTE_FIELDS[field]);
          byteCell.appendChild(byteSelect);
          row.appendChild(byteCell);
        }

        var timingsCell = document.createElement("td");
        timingsCell.className = "ir-timings-cell";
        timingsCell.colSpan = 4;
        var timingsInput = document.createElement("textarea");
        timingsInput.className = "ir-timing-input";
        timingsInput.placeholder = "Comma-separated values (up to 40)";
        timingsInput.setAttribute("aria-label", "Signal " + (index + 1) + " raw timings");
        timingsCell.appendChild(timingsInput);
        row.appendChild(timingsCell);

        var emptyDataCell = document.createElement("td");
        emptyDataCell.className = "ir-no-data-cell";
        emptyDataCell.colSpan = 4;
        row.appendChild(emptyDataCell);

        protocolSelect.addEventListener("change", function () {
          updateProtocolFields(row);
        });
        updateProtocolFields(row);

        var clearCell = document.createElement("td");
        var clearButton = document.createElement("button");
        clearButton.type = "button";
        clearButton.className = "red";
        clearButton.textContent = "Clear";
        clearButton.setAttribute("aria-label", "Clear signal " + (index + 1));
        clearButton.addEventListener("click", function () {
          clearSignalRow(row);
        });
        clearCell.appendChild(clearButton);
        row.appendChild(clearCell);

        return row;
      }

      function clearSignalRow(row) {
        row.querySelector(".ir-signal-name").value = "";
        row.querySelector(".ir-protocol-select").value = "0";
        row.querySelectorAll(".ir-byte-select").forEach(function (select) {
          select.value = "0";
        });
        row.querySelector(".ir-timing-input").value = "";
        updateProtocolFields(row);
      }

      function updateProtocolFields(row) {
        var protocol = Number(row.querySelector(".ir-protocol-select").value);
        row.querySelectorAll(".ir-nec-only").forEach(function (cell) {
          cell.hidden = protocol !== 0;
        });
        row.querySelector(".ir-timings-cell").hidden = protocol !== 2;
        row.querySelector(".ir-no-data-cell").hidden = protocol !== 1;
      }

      function isBytePair(bytes) {
        return Array.isArray(bytes) &&
          bytes.length === 2 &&
          bytes.every(function (value) {
            return Number.isInteger(value) && value >= 0 && value <= 0xFF;
          });
      }

      function populateSignalRows(entries) {
        var rows = document.querySelectorAll("#irSignalRows tr");
        if (entries.length !== rows.length) return false;

        rows.forEach(function (row) {
          row.querySelector(".ir-signal-name").value = "";
          row.querySelector(".ir-protocol-select").value = "0";
          row.querySelectorAll(".ir-byte-select").forEach(function (select) {
            select.value = "0";
          });
          row.querySelector(".ir-timing-input").value = "";
          updateProtocolFields(row);
        });

        for (var index = 0; index < entries.length; index++) {
          var signal = entries[index];
          if (!signal ||
              typeof signal.name !== "string" ||
              signal.name.length > IR_SIGNAL_NAME_MAX ||
              !Number.isInteger(signal.protocol) ||
              signal.protocol < 0 ||
              signal.protocol > 2 ||
              !isBytePair(signal.address) ||
              !isBytePair(signal.command) ||
              !Array.isArray(signal.rawData) ||
              signal.rawData.length > IR_RAW_TIMINGS_MAX ||
              !signal.rawData.every(function (timing) {
                return Number.isInteger(timing) && timing > 0 && timing <= 0xFFFF;
              })) {
            return false;
          }

          var row = rows[index];
          row.querySelector(".ir-signal-name").value = signal.name;
          row.querySelector(".ir-protocol-select").value = signal.protocol.toString();
          var selects = row.querySelectorAll(".ir-byte-select");
          selects[0].value = signal.address[0].toString();
          selects[1].value = signal.address[1].toString();
          selects[2].value = signal.command[0].toString();
          selects[3].value = signal.command[1].toString();
          row.querySelector(".ir-timing-input").value = signal.rawData.join(", ");
          updateProtocolFields(row);
        }

        return true;
      }

      function populateCommandOptions(entries) {
        var select = document.getElementById("command");
        while (select.options.length > 0) {
          select.remove(0);
        }

        var hasEntries = false;
        for (var index = 0; index < entries.length; index++) {
          var signal = entries[index];
          if (!signal.name) continue;

          var option = document.createElement("option");
          option.value = index.toString();
          option.textContent = signal.name;
          select.appendChild(option);
          hasEntries = true;
        }

        select.selectedIndex = -1;
        select.disabled = !hasEntries;
      }

      function updateCommandSelect() {
        var isCustom = document.getElementById("irTestType").value === "custom";
        document.getElementById("commandSelect").hidden = !isCustom;
      }

      function getInfrared() {
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function () {
          if (this.readyState != 4) return;

          if (this.status >= 200 && this.status < 300) {
            if (!isJsonString(this.responseText)) {
              handleStatus("The infrared settings response was not valid JSON.");
              return;
            }

            var settings = JSON.parse(this.responseText);
            if (!settings || !Array.isArray(settings.entries) || !populateSignalRows(settings.entries)) {
              handleStatus("The infrared settings response has an invalid entries array.");
            } else {
              populateCommandOptions(settings.entries);
            }
          } else {
            handleStatus(this.responseText || "Unable to load infrared settings.");
          }
        };
        xhttp.open("GET", "/infrared/settings", true);
        xhttp.send();
      }

      function triggerInfrared() {
        var command = document.getElementById("command").value;
        if (command === "") {
          alert("Select a configured command first.");
          return;
        }

        sendCommand("/infrared/signal?command=" + encodeURIComponent(command));
      }

      function saveInfrared() {
        var entries = [];
        document.querySelectorAll("#irSignalRows tr").forEach(function (row) {
          var selects = row.querySelectorAll(".ir-byte-select");
          entries.push({
            name: row.querySelector(".ir-signal-name").value,
            protocol: Number(row.querySelector(".ir-protocol-select").value),
            address: [Number(selects[0].value), Number(selects[1].value)],
            command: [Number(selects[2].value), Number(selects[3].value)],
            rawData: row.querySelector(".ir-timing-input").value,
          });
        });

        var body = JSON.stringify({
          entries: entries,
          triggers: {},
        });

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function () {
          if (this.readyState == 4 && this.status >= 200 && this.status < 300) {
            var jObj = JSON.parse(this.responseText);
            alert(jObj.status); // Always display status returned.
            getInfrared();
          } else if (this.readyState == 4) {
            handleStatus(this.responseText || "An unknown error occurred. Please try again.");
          }
        };
        xhttp.open("PUT", "/infrared/update", true);
        xhttp.setRequestHeader("Content-Type", "application/json");
        xhttp.send(body);
      }
    </script>
  </body>
</html>
