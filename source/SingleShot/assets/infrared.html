<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-control" content="public" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Infrared Settings</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>Infrared Settings</h1>
    <div class="block left">
      <p>
        View and configure infrared signals available for use and their triggering events (where applicable).
        Use the Test IR button to directly trigger a signal to confirm operation.
      </p>
    </div>

    <div class="block left">
      <div class="setting" id="commandSelect" hidden>
        <label for="command"><b>Signal:</b></label>
        <select id="command"></select>
        <button type="button" id="btnTest" class="orange" onclick="triggerInfrared()">Test IR</button>
      </div>
    </div>

    <div class="block left">
      <div>
        <table>
          <thead>
            <tr>
              <th scope="col">#&nbsp;</th>
              <th scope="col">Name</th>
              <th scope="col">Protocol</th>
              <th scope="col">Action</th>
            </tr>
            <tr>
              <th scope="col">&#8627;</th>
              <th scope="col" colspan="3">NEC Address/Command or Timings</th>
            </tr>
          </thead>
          <tbody id="irSignalRows"></tbody>
        </table>
      </div>
    </div>

    <div class="block">
      <hr />
      <div class="button-group">
        <a href="/">&laquo; Back</a>
        <button type="button" class="green" onclick="saveInfrared()" id="saveInfrared">Save</button>
      </div>
    </div>

    <template id="irByteSelectTemplate">
      <select class="ir-byte-select"></select>
    </template>

    <script type="application/javascript" src="/common.js"></script>
    <script type="application/javascript">
      const IR_ENTRIES_MAX = 20;
      const IR_ENTRY_NAME_MAX = 20;
      const IR_RAW_TIMINGS_MAX = 40;
      const IR_PROTECTION_READ_WRITE = 0;
      // These protocol values must stay aligned with the firmware IR_PROTOCOL enum.
      const IR_PROTOCOL_OPTIONS = [
        { value: 0, label: "NEC" },
        { value: 1, label: "NEC RAW" },
        { value: 2, label: "TIMINGS" },
      ];
      const IR_NEC_BYTE_FIELDS = [
        "Address Byte 1",
        "Address Byte 2",
        "Command Byte 1",
        "Command Byte 2"
      ];

      window.addEventListener("load", onLoad);
      // Build the editable slots, load their current values, and initialize page help.
      function onLoad() {
        createSignalRows();
        getSettings();

        initializeHelp("infrared");
      }

      // Add every byte value to the shared template, then create the fixed set of entry rows.
      function createSignalRows() {
        var selectTemplate = document.getElementById("irByteSelectTemplate").content.querySelector("select");
        for (var value = 0; value <= 0xFF; value++) {
          var option = document.createElement("option");
          option.value = value.toString();
          option.textContent = value.toString(16).padStart(2, "0").toUpperCase();
          selectTemplate.appendChild(option);
        }

        var rows = document.getElementById("irSignalRows");
        for (var index = 0; index < IR_ENTRIES_MAX; index++) {
          rows.appendChild(createSignalRow(index, selectTemplate));
        }
      }

      // Build the name/protocol row and its corresponding data row for one entry slot.
      function createSignalRow(index, selectTemplate) {
        var entryRow = document.createElement("tr");
        var dataRow = document.createElement("tr");

        var indexCell = document.createElement("th");
        indexCell.scope = "row";
        indexCell.textContent = (index + 1).toString() + "\u00A0";
        entryRow.appendChild(indexCell);

        var nameCell = document.createElement("td");
        var nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.size = IR_ENTRY_NAME_MAX;
        nameInput.maxLength = IR_ENTRY_NAME_MAX;
        nameInput.className = "ir-entries-name";
        nameInput.setAttribute("aria-label", "Signal " + (index + 1) + " name");
        nameCell.appendChild(nameInput);
        entryRow.appendChild(nameCell);

        var protocolCell = document.createElement("td");
        var protocolSelect = document.createElement("select");
        protocolSelect.className = "ir-protocol-select";
        protocolSelect.setAttribute("aria-label", "Signal " + (index + 1) + " protocol");
        IR_PROTOCOL_OPTIONS.forEach(function (protocol) {
          var option = document.createElement("option");
          option.value = protocol.value.toString();
          option.textContent = protocol.label;
          protocolSelect.appendChild(option);
        });
        protocolCell.appendChild(protocolSelect);
        entryRow.appendChild(protocolCell);

        var clearCell = document.createElement("td");
        var clearButton = document.createElement("button");
        clearButton.type = "button";
        clearButton.className = "red ir-clear-button";
        clearButton.textContent = "Clear";
        clearButton.hidden = true;
        clearButton.setAttribute("aria-label", "Clear entries " + (index + 1));
        clearButton.addEventListener("click", function () {
          clearSignalRow(entryRow);
        });
        clearCell.appendChild(clearButton);
        entryRow.appendChild(clearCell);

        dataRow.appendChild(document.createElement("td"));
        var dataCell = document.createElement("td");
        dataCell.colSpan = 3;
        var byteFields = document.createElement("div");
        byteFields.className = "ir-nec-only";
        for (var field = 0; field < IR_NEC_BYTE_FIELDS.length; field++) {
          // Label the first select in each two-byte NEC pair.
          if (field === 0 || field === 2) {
            var byteGroupLabel = document.createElement("span");
            byteGroupLabel.textContent = field === 0 ? "ADDR:" : "\u00A0\u00A0CMD:";
            byteFields.appendChild(byteGroupLabel);
          }
          var byteSelect = selectTemplate.cloneNode(true);
          byteSelect.value = "0";
          byteSelect.setAttribute("aria-label", "Signal " + (index + 1) + " " + IR_NEC_BYTE_FIELDS[field]);
          byteFields.appendChild(byteSelect);
        }
        dataCell.appendChild(byteFields);

        var timingsInput = document.createElement("textarea");
        timingsInput.className = "ir-timing-input";
        timingsInput.placeholder = "Comma-separated values (up to 40)";
        timingsInput.setAttribute("aria-label", "Signal " + (index + 1) + " raw timings");
        dataCell.appendChild(timingsInput);
        dataRow.appendChild(dataCell);

        protocolSelect.addEventListener("change", function () {
          updateProtocolFields(entryRow);
        });

        var entryRows = document.createDocumentFragment();
        entryRows.appendChild(entryRow);
        entryRows.appendChild(dataRow);
        updateProtocolFields(entryRow);
        return entryRows;
      }

      // Clear one editable entry and restore its default NEC field visibility.
      function clearSignalRow(row) {
        row.querySelector(".ir-entries-name").value = "";
        row.querySelector(".ir-protocol-select").value = "0";
        var dataRow = row.nextElementSibling;
        dataRow.querySelectorAll(".ir-byte-select").forEach(function (select) {
          select.value = "0";
        });
        dataRow.querySelector(".ir-timing-input").value = "";
        updateProtocolFields(row);
      }

      // Show only the input controls used by the selected protocol.
      function updateProtocolFields(row) {
        var protocol = row.querySelector(".ir-protocol-select").value;
        var dataRow = row.nextElementSibling;
        dataRow.querySelector(".ir-nec-only").hidden = protocol !== "0";
        dataRow.querySelector(".ir-timing-input").hidden = protocol !== "2";
      }

      // Select a representable byte value; disable the control if the value has no option.
      function setByteSelect(select, value, isReadWrite) {
        select.value = Number.isInteger(value) ? value.toString() : "";
        select.disabled = !isReadWrite || select.value === "";
      }

      // Populate rows independently so malformed fields do not prevent other entries loading.
      function populateSignalRows(entries) {
        var rows = document.querySelectorAll("#irSignalRows tr");
        for (var index = 0; index < rows.length; index += 2) {
          var row = rows[index];
          var dataRow = rows[index + 1];
          var nameInput = row.querySelector(".ir-entries-name");
          var protocolSelect = row.querySelector(".ir-protocol-select");
          nameInput.value = "";
          nameInput.disabled = true;
          protocolSelect.value = "";
          protocolSelect.disabled = true;
          row.querySelector("button").hidden = true;
          dataRow.hidden = true;
          dataRow.querySelectorAll(".ir-byte-select").forEach(function (select) {
            select.value = "";
            select.disabled = true;
          });
          var timingsInput = dataRow.querySelector(".ir-timing-input");
          timingsInput.value = "";
          timingsInput.disabled = true;
          updateProtocolFields(row);
        }

        // Keep usable fields available when another field in an entry is malformed.
        var entryCount = Math.min(entries.length, rows.length / 2);
        for (var index = 0; index < entryCount; index++) {
          var entry = entries[index];
          var row = rows[index * 2];
          var dataRow = rows[index * 2 + 1];
          if (!entry || typeof entry !== "object" || Array.isArray(entry)) continue;

          var nameInput = row.querySelector(".ir-entries-name");
          var protocolSelect = row.querySelector(".ir-protocol-select");
          var isReadWrite = entry.protection === IR_PROTECTION_READ_WRITE;
          var hasName = typeof entry.name === "string";
          nameInput.value = hasName ? entry.name : "";
          nameInput.disabled = !isReadWrite || !hasName || entry.name.length > IR_ENTRY_NAME_MAX;
          protocolSelect.value = Number.isInteger(entry.protocol) ? entry.protocol.toString() : "";
          var hasProtocol = protocolSelect.value !== "";
          protocolSelect.disabled = !isReadWrite || !hasProtocol;
          row.querySelector("button").hidden = !isReadWrite;
          dataRow.hidden = !hasProtocol || (!isReadWrite && protocolSelect.value !== "2");

          var selects = dataRow.querySelectorAll(".ir-byte-select");
          var address = Array.isArray(entry.address) ? entry.address : [];
          var command = Array.isArray(entry.command) ? entry.command : [];
          setByteSelect(selects[0], address[0], isReadWrite);
          setByteSelect(selects[1], address[1], isReadWrite);
          setByteSelect(selects[2], command[0], isReadWrite);
          setByteSelect(selects[3], command[1], isReadWrite);

          var timingsInput = dataRow.querySelector(".ir-timing-input");
          var rawData = Array.isArray(entry.rawData) ? entry.rawData : [];
          var hasValidTimings = Array.isArray(entry.rawData) &&
            rawData.length <= IR_RAW_TIMINGS_MAX &&
            rawData.every(function (timing) {
              return Number.isInteger(timing) && timing > 0 && timing <= 0xFFFF;
            });
          timingsInput.value = rawData.join(", ");
          timingsInput.disabled = !isReadWrite || !hasValidTimings;
          updateProtocolFields(row);
        }
      }

      // Add named entries to the Test IR selector and show it only when it has choices.
      function populateCommandOptions(entries) {
        var select = document.getElementById("command");
        while (select.options.length > 0) {
          select.remove(0);
        }

        var hasEntries = false;
        for (var index = 0; index < entries.length && index < IR_ENTRIES_MAX; index++) {
          var entry = entries[index];
          if (!entry || typeof entry.name !== "string" || !entry.name) continue;

          var option = document.createElement("option");
          option.value = index.toString();
          option.textContent = entry.name;
          select.appendChild(option);
          hasEntries = true;
        }

        select.selectedIndex = -1;
        select.disabled = !hasEntries;
        document.getElementById("commandSelect").hidden = !hasEntries;
      }

      // Fetch saved settings and populate the page, reporting endpoint-level failures.
      function getSettings() {
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function () {
          if (this.readyState != 4) return;

          if (this.status >= 200 && this.status < 300) {
            if (!isJsonString(this.responseText)) {
              handleStatus("The infrared settings response was not valid JSON.");
              return;
            }

            var settings = JSON.parse(this.responseText);
            if (!settings || !Array.isArray(settings.entries)) {
              handleStatus("The infrared settings response has an invalid entries array.");
            } else {
              populateSignalRows(settings.entries);
              populateCommandOptions(settings.entries);
            }
          } else {
            handleStatus(this.responseText || "Unable to load infrared settings.");
          }
        };
        xhttp.open("GET", "/infrared/settings", true);
        xhttp.send();
      }

      // Trigger the signal to be sent by the IR hardware.
      function triggerInfrared() {
        var command = document.getElementById("command").value;
        if (command === "") {
          alert("Select a configured command first.");
          return;
        }
        sendCommand("/infrared/entries?command=" + encodeURIComponent(command));
      }

      // Serialize all slots and submit them, then reload the saved values on success.
      function saveInfrared() {
        var entries = [];
        var rows = document.querySelectorAll("#irSignalRows tr");
        for (var index = 0; index < rows.length; index += 2) {
          var row = rows[index];
          var dataRow = rows[index + 1];
          var selects = dataRow.querySelectorAll(".ir-byte-select");
          entries.push({
            name: row.querySelector(".ir-entries-name").value,
            protocol: Number(row.querySelector(".ir-protocol-select").value),
            address: [Number(selects[0].value), Number(selects[1].value)],
            command: [Number(selects[2].value), Number(selects[3].value)],
            rawData: dataRow.querySelector(".ir-timing-input").value,
          });
        }

        var body = JSON.stringify({
          entries: entries,
          triggers: {},
        });

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function () {
          if (this.readyState == 4 && this.status >= 200 && this.status < 300) {
            var jObj = JSON.parse(this.responseText);
            alert(jObj.status); // Always display status returned.
            getSettings();
          } else if (this.readyState == 4) {
            handleStatus(this.responseText || "An unknown error occurred. Please try again.");
          }
        };
        xhttp.open("PUT", "/infrared/update", true);
        xhttp.setRequestHeader("Content-Type", "application/json");
        xhttp.send(body);
      }
    </script>
  </body>
</html>
